<!doctype html><html lang="en"><head><meta charset="utf-8"><title>ArenaLink</title><style>*{box-sizing:border-box}body{width:430px;margin:0;padding:24px;background:#101018;color:#eeeaf8;font:14px system-ui}h1{margin:0;color:#c5adff}p,small{color:#aaa4b9;line-height:1.5}label{display:block;margin:16px 0 6px}input,textarea{width:100%;border:1px solid #393346;border-radius:8px;background:#1c1c29;color:#eeeaf8;padding:10px}textarea{height:180px;font:12px monospace}button{border:0;border-radius:8px;padding:11px 14px;margin:12px 5px 0 0;background:#7650c9;color:white;cursor:pointer}button:disabled{opacity:.5}pre{white-space:pre-wrap;overflow-wrap:anywhere;background:#1c1c29;padding:12px;max-height:200px;overflow:auto}</style></head><body><h1>ArenaLink</h1><p>Send a plan. Review it on your desktop. Keep this popup open until it finishes.</p><label for="token">Pairing token</label><input id="token" type="password" autocomplete="off"><small>Stored for this browser session only.</small><label for="plan">Action plan (JSON)</label><textarea id="plan" spellcheck="false"></textarea><button id="selection">Use selected Arena.ai text</button><button id="send">Send for approval</button><pre id="result">Choose a workspace in the desktop app first.</pre><button id="copy">Copy result</button><script src="popup.js"></script></body></html>
